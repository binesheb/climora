name: Build and Release CLIMORA

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate pinned GitHub Actions
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          errors = []
          for path in sorted(Path(".github/workflows").rglob("*.yml")):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.match(r"^\s*uses\s*:\s*(\S+)", line)
                  if not match:
                      continue
                  value = match.group(1)
                  if value.startswith("./"):
                      continue
                  if "@" not in value:
                      errors.append(f"{path}:{number}: action reference is not pinned")
                      continue
                  action, ref = value.rsplit("@", 1)
                  if not re.fullmatch(r"[0-9a-fA-F]{40}", ref):
                      errors.append(f"{path}:{number}: {action} must use a 40-character commit SHA")
                  if not re.search(r"#\s*v[0-9][0-9A-Za-z.+-]*\s*$", line):
                      errors.append(f"{path}:{number}: {action} must include an explicit version comment")

          if errors:
              raise SystemExit("\n".join(errors))
          print("All GitHub Actions are pinned to commit SHAs with explicit version comments.")
          PY

      - name: Verify release tag comes from main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify release tag and changelog
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "## [${RELEASE_TAG#v}]" CHANGELOG.md

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Configure ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Install libraries
        run: |
          arduino-cli lib install FastLED@3.10.5
          arduino-cli lib install ArduinoJson@7.4.3

      - name: Prepare sketch
        run: |
          mkdir -p .build/sketch .build/out
          cp *.ino .build/sketch/sketch.ino
          cp *.cpp .build/sketch/ 2>/dev/null || true
          cp *.h .build/sketch/ 2>/dev/null || true

      - name: Compile ESP32 firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --board-options PartitionScheme=min_spiffs \
            --build-property 'compiler.cpp.extra_flags=-Dmbedtls_sha256_starts_ret=mbedtls_sha256_starts -Dmbedtls_sha256_update_ret=mbedtls_sha256_update -Dmbedtls_sha256_finish_ret=mbedtls_sha256_finish' \
            --output-dir .build/out \
            .build/sketch

      - name: Verify firmware binary
        run: |
          test -s .build/out/*.ino.bin
          ls -lh .build/out/*.ino.bin

      - name: Rename firmware
        run: |
          cp .build/out/*.ino.bin climora-firmware.bin
          sha256sum climora-firmware.bin > climora-firmware.bin.sha256
          sha256sum -c climora-firmware.bin.sha256
          cat climora-firmware.bin.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: climora-firmware-${{ github.sha }}
          path: |
            climora-firmware.bin
            climora-firmware.bin.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: climora-firmware-${{ github.sha }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/climora-firmware.bin
            release/climora-firmware.bin.sha256
