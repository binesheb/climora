name: Build and Release CLIMORA

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify release tag comes from main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify release tag and changelog
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "## [${RELEASE_TAG#v}]" CHANGELOG.md

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Configure ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Install libraries
        run: |
          arduino-cli lib install FastLED@3.10.5
          arduino-cli lib install ArduinoJson@7.4.3

      - name: Prepare sketch
        run: |
          mkdir -p .build/sketch .build/out
          cp *.ino .build/sketch/sketch.ino
          cp *.cpp .build/sketch/ 2>/dev/null || true
          cp *.h .build/sketch/ 2>/dev/null || true

      - name: Compile ESP32 firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --board-options PartitionScheme=min_spiffs \
            --build-property 'compiler.cpp.extra_flags=-Dmbedtls_sha256_starts_ret=mbedtls_sha256_starts -Dmbedtls_sha256_update_ret=mbedtls_sha256_update -Dmbedtls_sha256_finish_ret=mbedtls_sha256_finish' \
            --output-dir .build/out \
            .build/sketch

      - name: Verify firmware binary
        run: |
          test -s .build/out/*.ino.bin
          ls -lh .build/out/*.ino.bin

      - name: Rename firmware
        run: |
          cp .build/out/*.ino.bin climora-firmware.bin
          sha256sum climora-firmware.bin > climora-firmware.bin.sha256
          sha256sum -c climora-firmware.bin.sha256
          cat climora-firmware.bin.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: climora-firmware-${{ github.sha }}
          path: |
            climora-firmware.bin
            climora-firmware.bin.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: climora-firmware-${{ github.sha }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/climora-firmware.bin
            release/climora-firmware.bin.sha256
